[package]
name = "vegastack-pages"
version = "0.1.4"
edition = "2021"
license = "MIT"

[[bin]]
name = "vpg"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
