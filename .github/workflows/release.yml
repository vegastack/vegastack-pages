name: Release

# Tag-driven release pipeline:
#   1. build-cli-matrix    cross-builds the Rust CLI for every supported target
#   2. publish-npm         publishes per-platform sub-packages + the umbrella
#                          @vegastack/pages package via npm OIDC trusted
#                          publishing, with SLSA build provenance attestations
#   3. github-release      cuts a GitHub release with the matching CHANGELOG
#                          slice as the body
#   4. deploy-worker       on stable (non-prerelease) tags only, deploys
#                          apps/web to the Cloudflare Worker at
#                          pages.vegastack.com via wrangler

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v0.1.0-next.0 or v0.1.0)."
        required: true
        type: string
      npm_tag:
        description: "npm dist-tag. Use next for develop prereleases, latest for main stable releases."
        required: true
        default: "next"
        type: choice
        options: ["next", "latest"]
      deploy_worker:
        description: "Deploy Cloudflare Worker (apps/web). 'auto' = yes on stable, no on prerelease."
        required: false
        type: choice
        default: "auto"
        options: ["auto", "yes", "no"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-cli-matrix:
    name: Build CLI (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-13
            platform: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-14
            platform: darwin-arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: win32-x64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable as of 2026-05-08
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install linux-arm64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cross-build
        working-directory: cli/vegastack-pages
        shell: bash
        run: node scripts/cross-build.mjs --target ${{ matrix.target }} --platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.platform }}
          path: cli/vegastack-pages/npm-publish/${{ matrix.platform }}
          if-no-files-found: error

  publish-npm:
    name: Publish to npm (OIDC trusted publishing)
    needs: build-cli-matrix
    runs-on: ubuntu-latest
    environment: npm-vegastack
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.33.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Pin npm to a version that speaks OIDC trusted publishing
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile --no-optional

      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b6f43b9a4c4d52a7e7e1a5e7 # v4.1.8
        with:
          path: cli/vegastack-pages/npm-publish
          pattern: cli-*
          merge-multiple: false

      - name: Stitch per-platform sub-packages
        working-directory: cli/vegastack-pages
        run: node scripts/pack-platforms.mjs

      - name: Verify version matches tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          NPM_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_tag || (contains(github.ref_name, '-') && 'next' || 'latest') }}
        run: |
          PKG_VER=$(node -p "require('./cli/vegastack-pages/package.json').version")
          TAG_VER="${TAG#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::version mismatch: package.json=$PKG_VER tag=$TAG_VER"
            exit 1
          fi
          if [ "$NPM_TAG" = "latest" ] && echo "$PKG_VER" | grep -Eq '-'; then
            echo "::error::refusing to publish prerelease $PKG_VER under npm tag latest"
            exit 1
          fi
          if [ "$NPM_TAG" = "next" ] && ! echo "$PKG_VER" | grep -Eq '-'; then
            echo "::error::refusing to publish stable $PKG_VER under npm tag next"
            exit 1
          fi

      - name: Pack umbrella @vegastack/pages tarball
        id: pack
        working-directory: cli/vegastack-pages
        run: |
          npm pack --json > /tmp/pack.json
          TARBALL=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/pack.json','utf8'))[0].filename")
          echo "tarball=cli/vegastack-pages/$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance (umbrella)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Publish per-platform sub-packages
        env:
          NPM_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_tag || (contains(github.ref_name, '-') && 'next' || 'latest') }}
        run: |
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken || true
          shopt -s nullglob
          for dir in cli/vegastack-pages/npm-publish/*/ ; do
            [ -f "${dir}package.json" ] || continue
            pkg=$(node -p "require('./${dir}package.json').name")
            ver=$(node -p "require('./${dir}package.json').version")
            echo "::group::publish $pkg@$ver --tag $NPM_TAG"
            npm publish "$dir" --access public --tag "$NPM_TAG"
            echo "::endgroup::"
          done

      - name: Publish umbrella @vegastack/pages
        env:
          NPM_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_tag || (contains(github.ref_name, '-') && 'next' || 'latest') }}
        run: |
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken || true
          npm publish "${{ steps.pack.outputs.tarball }}" --access public --tag "$NPM_TAG"

  github-release:
    name: GitHub release
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Extract release notes
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [ -f CHANGELOG.md ]; then
            VER="${TAG#v}"
            awk "/^## \\[?${VER//./\\.}\\]?( |$)/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > /tmp/notes.md || true
          fi
          if [ ! -s /tmp/notes.md ]; then
            echo "Release ${TAG}" > /tmp/notes.md
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.4.0
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: /tmp/notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
          fail_on_unmatched_files: false

  deploy-worker:
    name: Deploy Cloudflare Worker
    needs: github-release
    runs-on: ubuntu-latest
    environment: cloudflare-prod
    if: |
      (github.event_name == 'workflow_dispatch'
        && (inputs.deploy_worker == 'yes'
            || (inputs.deploy_worker == 'auto' && !contains(inputs.tag, '-'))))
      || (github.event_name == 'push' && !contains(github.ref_name, '-'))
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.33.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile --no-optional

      - name: Write managed Wrangler config
        working-directory: apps/web
        env:
          VPG_D1_DATABASE_ID: ${{ secrets.VPG_D1_DATABASE_ID }}
          VPG_D1_DATABASE_NAME: ${{ vars.VPG_D1_DATABASE_NAME || 'vegastack_pages' }}
          VPG_KV_NAMESPACE_ID: ${{ secrets.VPG_KV_NAMESPACE_ID }}
          VPG_R2_BUCKET_NAME: ${{ vars.VPG_R2_BUCKET_NAME || 'vegastack-pages-content' }}
          VPG_GITHUB_APP_ID: ${{ vars.VPG_GITHUB_APP_ID }}
          VPG_GITHUB_APP_SLUG: ${{ vars.VPG_GITHUB_APP_SLUG || 'vegastack-pages' }}
          VPG_GITHUB_SYNC_CRON: ${{ vars.VPG_GITHUB_SYNC_CRON || '17 2 * * *' }}
          VPG_EMAIL_FROM: ${{ vars.VPG_EMAIL_FROM }}
          VPG_EMAIL_FROM_NAME: ${{ vars.VPG_EMAIL_FROM_NAME || 'VegaStack Pages' }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const required = ["VPG_D1_DATABASE_ID", "VPG_KV_NAMESPACE_ID"];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length > 0) {
            throw new Error(`Missing Cloudflare production config: ${missing.join(", ")}`);
          }

          const cron = process.env.VPG_GITHUB_SYNC_CRON || "17 2 * * *";
          const emailFrom = process.env.VPG_EMAIL_FROM || "";
          const config = {
            $schema: "../../node_modules/wrangler/config-schema.json",
            name: "vegastack-pages",
            main: "./src/worker.ts",
            compatibility_date: "2026-05-10",
            compatibility_flags: ["nodejs_compat", "global_fetch_strictly_public"],
            assets: {
              binding: "ASSETS",
              directory: "./dist/client",
            },
            observability: {
              enabled: true,
            },
            workers_dev: false,
            routes: [{ pattern: "pages.vegastack.com", custom_domain: true }],
            vars: {
              VPG_RUNTIME: "cloudflare",
              VPG_DEPLOYMENT_MODE: "managed",
              VPG_PUBLIC_SIGNUP: "true",
              VPG_BASE_URL: "https://pages.vegastack.com",
              VPG_HOME_MODE: "landing",
              VPG_EMAIL_PROVIDER: emailFrom ? "cloudflare" : "auto",
              VPG_EMAIL_FROM: emailFrom,
              VPG_EMAIL_FROM_NAME:
                process.env.VPG_EMAIL_FROM_NAME || "VegaStack Pages",
              VPG_GITHUB_APP_ID: process.env.VPG_GITHUB_APP_ID || "",
              VPG_GITHUB_APP_SLUG:
                process.env.VPG_GITHUB_APP_SLUG || "vegastack-pages",
              VPG_GITHUB_SYNC_CRON: cron,
            },
            triggers: {
              crons: [cron],
            },
            d1_databases: [
              {
                binding: "DB",
                database_name:
                  process.env.VPG_D1_DATABASE_NAME || "vegastack_pages",
                database_id: process.env.VPG_D1_DATABASE_ID,
                migrations_dir: "../../packages/db/migrations",
              },
            ],
            kv_namespaces: [
              {
                binding: "SESSION",
                id: process.env.VPG_KV_NAMESPACE_ID,
              },
            ],
            r2_buckets: [
              {
                binding: "CONTENT",
                bucket_name:
                  process.env.VPG_R2_BUCKET_NAME ||
                  "vegastack-pages-content",
              },
            ],
          };
          if (emailFrom) {
            config.send_email = [
              {
                name: "EMAIL",
                allowed_sender_addresses: [emailFrom],
              },
            ];
          }
          fs.writeFileSync("wrangler.jsonc", `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - run: pnpm --filter @vegastack/pages-web build

      - name: Verify deploy config
        working-directory: apps/web
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync("dist/server/wrangler.json", "utf8"));
          const missing = [];
          if (!config.d1_databases?.some((binding) => binding.binding === "DB")) {
            missing.push("D1 binding DB");
          }
          if (!config.r2_buckets?.some((binding) => binding.binding === "CONTENT")) {
            missing.push("R2 binding CONTENT");
          }
          if (!config.kv_namespaces?.some((binding) => binding.binding === "SESSION")) {
            missing.push("KV binding SESSION");
          }
          if (!config.triggers?.crons?.includes(process.env.VPG_GITHUB_SYNC_CRON || "17 2 * * *")) {
            missing.push("GitHub backup cron trigger");
          }
          if (missing.length > 0) {
            throw new Error(`Generated deploy config is missing: ${missing.join(", ")}`);
          }
          NODE

      - name: Wrangler deploy (apps/web → pages.vegastack.com)
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VPG_GITHUB_SYNC_CRON: ${{ vars.VPG_GITHUB_SYNC_CRON || '17 2 * * *' }}
        run: pnpm exec wrangler deploy
