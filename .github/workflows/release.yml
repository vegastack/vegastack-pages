name: Release

# Tag-driven release pipeline:
#   1. deploy-worker       on stable (non-prerelease) tags, deploys apps/web
#                          to pages.vegastack.com without waiting on npm
#   2. build-cli-matrix    cross-builds the Rust CLI for every supported target
#   3. publish-npm         publishes per-platform sub-packages + the umbrella
#                          @vegastack/pages package via npm OIDC trusted
#                          publishing, with SLSA build provenance attestations
#   4. github-release      cuts a GitHub release with the matching CHANGELOG
#                          slice after deploy + npm complete

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v0.1.0-next.0 or v0.1.0)."
        required: true
        type: string
      npm_tag:
        description: "npm dist-tag. Use next for develop prereleases, latest for main stable releases."
        required: true
        default: "next"
        type: choice
        options: ["next", "latest"]
      deploy_worker:
        description: "Deploy Cloudflare Worker (apps/web). 'auto' = yes on stable, no on prerelease."
        required: false
        type: choice
        default: "auto"
        options: ["auto", "yes", "no"]
      publish_npm:
        description: "Publish to npm. Set 'no' when re-dispatching a tag whose packages are already published (e.g. to retry only deploy-worker after a CI bug). Default 'yes' runs build-cli-matrix and publish-npm."
        required: false
        type: choice
        default: "yes"
        options: ["yes", "no"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-cli-matrix:
    name: Build CLI (${{ matrix.platform }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_npm != 'no' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            # macos-13 Intel runners can stay queued for a long time on first
            # releases. Build the x64 target from macos-14 instead; if the
            # cross-link step ever fails, the failure is concrete and patchable.
            os: macos-14
            platform: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-14
            platform: darwin-arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: win32-x64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable as of 2026-05-08
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install linux-arm64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cross-build
        working-directory: cli/vegastack-pages
        shell: bash
        run: node scripts/cross-build.mjs --target ${{ matrix.target }} --platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.platform }}
          path: cli/vegastack-pages/npm-publish/${{ matrix.platform }}
          if-no-files-found: error

  publish-npm:
    name: Publish to npm (OIDC trusted publishing)
    needs: build-cli-matrix
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_npm != 'no' }}
    runs-on: ubuntu-latest
    environment: npm-vegastack
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Pin npm to a version that speaks OIDC trusted publishing
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          path: cli/vegastack-pages/npm-publish
          pattern: cli-*
          merge-multiple: false

      - name: Stitch per-platform sub-packages
        working-directory: cli/vegastack-pages
        run: node scripts/pack-platforms.mjs

      - name: Verify version matches tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          NPM_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_tag || (contains(github.ref_name, '-') && 'next' || 'latest') }}
        run: |
          PKG_VER=$(node -p "require('./cli/vegastack-pages/package.json').version")
          TAG_VER="${TAG#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::version mismatch: package.json=$PKG_VER tag=$TAG_VER"
            exit 1
          fi
          if [ "$NPM_TAG" = "latest" ] && echo "$PKG_VER" | grep -Eq '-'; then
            echo "::error::refusing to publish prerelease $PKG_VER under npm tag latest"
            exit 1
          fi
          if [ "$NPM_TAG" = "next" ] && ! echo "$PKG_VER" | grep -Eq '-'; then
            echo "::error::refusing to publish stable $PKG_VER under npm tag next"
            exit 1
          fi

      - name: Pack umbrella @vegastack/pages tarball
        id: pack
        working-directory: cli/vegastack-pages
        run: |
          npm pack --json > /tmp/pack.json
          TARBALL=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/pack.json','utf8'))[0].filename")
          echo "tarball=cli/vegastack-pages/$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance (umbrella)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Publish per-platform sub-packages
        env:
          NPM_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_tag || (contains(github.ref_name, '-') && 'next' || 'latest') }}
        run: |
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken || true
          shopt -s nullglob
          for dir in cli/vegastack-pages/npm-publish/*/ ; do
            [ -f "${dir}package.json" ] || continue
            pkg=$(node -p "require('./${dir}package.json').name")
            ver=$(node -p "require('./${dir}package.json').version")
            echo "::group::publish $pkg@$ver --tag $NPM_TAG"
            npm publish "$dir" --access public --tag "$NPM_TAG"
            echo "::endgroup::"
          done

      - name: Publish umbrella @vegastack/pages
        env:
          NPM_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_tag || (contains(github.ref_name, '-') && 'next' || 'latest') }}
        run: |
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken || true
          npm publish "${{ steps.pack.outputs.tarball }}" --access public --tag "$NPM_TAG"

  github-release:
    name: GitHub release
    needs: [publish-npm, deploy-worker]
    if: |
      always()
      && (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
      && (needs.deploy-worker.result == 'success' || needs.deploy-worker.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Extract release notes
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [ -f CHANGELOG.md ]; then
            VER="${TAG#v}"
            awk "/^## \\[?${VER//./\\.}\\]?( |$)/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > /tmp/notes.md || true
          fi
          if [ ! -s /tmp/notes.md ]; then
            echo "Release ${TAG}" > /tmp/notes.md
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.4.0
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: /tmp/notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
          fail_on_unmatched_files: false

  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    environment: cloudflare-prod
    if: |
      (github.event_name == 'workflow_dispatch'
        && (inputs.deploy_worker == 'yes'
            || (inputs.deploy_worker == 'auto' && !contains(inputs.tag, '-'))))
      || (github.event_name == 'push' && !contains(github.ref_name, '-'))
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Mask managed Cloudflare config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VPG_WORKER_NAME: ${{ secrets.VPG_WORKER_NAME }}
          VPG_CUSTOM_DOMAIN: ${{ secrets.VPG_CUSTOM_DOMAIN }}
          VPG_D1_DATABASE_ID: ${{ secrets.VPG_D1_DATABASE_ID }}
          VPG_D1_DATABASE_NAME: ${{ secrets.VPG_D1_DATABASE_NAME }}
          VPG_R2_BUCKET_NAME: ${{ secrets.VPG_R2_BUCKET_NAME }}
          VPG_GITHUB_APP_ID: ${{ secrets.VPG_GITHUB_APP_ID }}
          VPG_GITHUB_APP_SLUG: ${{ secrets.VPG_GITHUB_APP_SLUG }}
        run: |
          for value in \
            "$CLOUDFLARE_ACCOUNT_ID" \
            "$CLOUDFLARE_API_TOKEN" \
            "$VPG_WORKER_NAME" \
            "$VPG_CUSTOM_DOMAIN" \
            "$VPG_D1_DATABASE_ID" \
            "$VPG_D1_DATABASE_NAME" \
            "$VPG_R2_BUCKET_NAME" \
            "$VPG_GITHUB_APP_ID" \
            "$VPG_GITHUB_APP_SLUG"; do
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
          done

      - name: Substitute placeholders in canonical Wrangler config
        # The canonical config lives at apps/web/wrangler.jsonc and is the
        # single source of truth (no KV, two crons, send_email binding,
        # rate limit, smart placement). CI does NOT regenerate it — that
        # caused config drift (KV reintroduced, only one cron) where the
        # deployed Worker silently diverged from the reviewed branch.
        # We make a sandbox copy with the production-only secret values
        # substituted in-place via string replace, then deploy from it.
        working-directory: apps/web
        env:
          VPG_D1_DATABASE_ID: ${{ secrets.VPG_D1_DATABASE_ID }}
          VPG_D1_DATABASE_NAME: ${{ secrets.VPG_D1_DATABASE_NAME }}
          VPG_R2_BUCKET_NAME: ${{ secrets.VPG_R2_BUCKET_NAME }}
          VPG_WORKER_NAME: ${{ secrets.VPG_WORKER_NAME }}
          VPG_CUSTOM_DOMAIN: ${{ secrets.VPG_CUSTOM_DOMAIN }}
          VPG_GITHUB_APP_ID: ${{ secrets.VPG_GITHUB_APP_ID }}
          VPG_GITHUB_APP_SLUG: ${{ secrets.VPG_GITHUB_APP_SLUG }}
          VPG_EMAIL_FROM: ${{ secrets.VPG_EMAIL_FROM }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const required = [
            "VPG_D1_DATABASE_ID",
            "VPG_D1_DATABASE_NAME",
            "VPG_R2_BUCKET_NAME",
            "VPG_WORKER_NAME",
            "VPG_CUSTOM_DOMAIN",
          ];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length > 0) {
            throw new Error(`Missing Cloudflare production config: ${missing.join(", ")}`);
          }

          // Read canonical (JSONC with comments) and substitute the
          // placeholder values via string replace. The placeholders are
          // the literal strings shipped in apps/web/wrangler.jsonc so
          // self-hosters can also do this swap manually.
          let cfg = fs.readFileSync("wrangler.jsonc", "utf8");
          const replacements = [
            ['"name": "vegastack-pages"', `"name": ${JSON.stringify(process.env.VPG_WORKER_NAME)}`],
            ['"database_name": "vegastack-pages-db"', `"database_name": ${JSON.stringify(process.env.VPG_D1_DATABASE_NAME)}`],
            ['"database_id": "00000000-0000-0000-0000-000000000000"', `"database_id": ${JSON.stringify(process.env.VPG_D1_DATABASE_ID)}`],
            ['"bucket_name": "vegastack-pages-content"', `"bucket_name": ${JSON.stringify(process.env.VPG_R2_BUCKET_NAME)}`],
            ['"pattern": "pages.vegastack.com", "custom_domain": true', `"pattern": ${JSON.stringify(process.env.VPG_CUSTOM_DOMAIN)}, "custom_domain": true`],
            ['"VPG_BASE_URL": "https://pages.vegastack.com"', `"VPG_BASE_URL": ${JSON.stringify(`https://${process.env.VPG_CUSTOM_DOMAIN}`)}`],
            ['"VPG_EMAIL_FROM": "login@pages.vegastack.com"', `"VPG_EMAIL_FROM": ${JSON.stringify(process.env.VPG_EMAIL_FROM || "login@pages.vegastack.com")}`],
            ['"login@pages.vegastack.com"', JSON.stringify(process.env.VPG_EMAIL_FROM || "login@pages.vegastack.com")],
          ];
          for (const [needle, value] of replacements) {
            if (!cfg.includes(needle)) {
              throw new Error(`Placeholder not found in canonical wrangler.jsonc: ${needle}`);
            }
            cfg = cfg.split(needle).join(value);
          }
          // Append optional GitHub App vars without disturbing the
          // canonical file's structure: write a side file consumed via
          // wrangler --var flags during deploy.
          fs.writeFileSync("wrangler.jsonc", cfg);
          NODE

      - run: pnpm --filter @vegastack/pages-web build

      - name: Verify deploy config
        working-directory: apps/web
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync("dist/server/wrangler.json", "utf8"));
          const errors = [];
          if (!config.d1_databases?.some((binding) => binding.binding === "DB")) {
            errors.push("missing D1 binding DB");
          }
          if (!config.r2_buckets?.some((binding) => binding.binding === "CONTENT")) {
            errors.push("missing R2 binding CONTENT");
          }
          // Canonical post-rebuild config: NO KV. The release must fail
          // if KV reappears in the generated deploy config — that means
          // wrangler.jsonc drifted.
          if (config.kv_namespaces?.length) {
            errors.push(`unexpected KV bindings: ${config.kv_namespaces.map((b) => b.binding).join(", ")}`);
          }
          // Both nightly crons must be registered. Strings are fixed
          // in the canonical wrangler.jsonc; if either is missing the
          // canonical was clobbered.
          const crons = config.triggers?.crons ?? [];
          for (const expected of ["0 3 * * *", "30 3 * * *"]) {
            if (!crons.includes(expected)) errors.push(`missing cron ${expected}`);
          }
          if (errors.length > 0) {
            throw new Error(`Generated deploy config invalid: ${errors.join("; ")}`);
          }
          NODE

      - name: Apply D1 migrations
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply DB --remote

      - name: Wrangler deploy (apps/web → pages.vegastack.com)
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Restore canonical Wrangler config
        # Undoes the in-place placeholder substitution from earlier so a
        # rerun of the workflow on a persistent runner sees a clean tree.
        # On the default GH-hosted runner this is a no-op (ephemeral fs).
        if: always()
        working-directory: apps/web
        run: git checkout -- wrangler.jsonc 2>/dev/null || true
