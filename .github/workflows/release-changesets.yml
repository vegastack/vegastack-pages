name: Release (Changesets)

# Opens or updates the "Version Packages" PR for main or develop. Public npm
# publishing, GitHub release notes, and the Cloudflare Worker deploy are
# handled by release.yml on tag push: develop prerelease tags publish to npm
# dist-tag `next`; main stable tags publish to `latest` and additionally
# deploy the Worker to pages.vegastack.com.

on:
  workflow_dispatch:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Open Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r --if-present build

      - name: Configure git author
        run: |
          git config --global user.name  "vegastack-bot"
          git config --global user.email "bot@vegastack.com"

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@e87c8ed249971350e47fab7515075f44eb134e5b # v1.7.0
        with:
          version: pnpm run version-sync
          commit: "chore: release versions"
          title: "chore: release versions"
          setupGitUser: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
